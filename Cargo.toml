[package]
name = "media-browser"
version = "0.4.51"
edition = "2024"
description = "Glimpse - Offline native media browser for large displays"
default-run = "media-browser"

[dependencies]
png = "=0.18.1"
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
# Unify the same pinned egui instance's font feature with eframe; offline,
# bundled monochrome fallback instead of depending on OS-installed emoji fonts.
egui = { version = "=0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
resvg = { version = "=0.45.1", default-features = false }
libloading = "=0.8.9"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
gif = "=0.14.2"
jpeg-decoder = { version = "=0.3.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
sha2 = "=0.10.9"
rfd = "=0.15.4"
moxcms = "=0.8.1"
notify = "=8.2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Registry"] }
windows-core = "=0.62.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
